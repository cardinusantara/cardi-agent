<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 388 842" width="388" height="842">
  <defs>
    <!-- Outer metallic frame gradient -->
    <linearGradient id="titaniumChassis" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="25%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="75%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Chrome edge highlight -->
    <linearGradient id="edgeGleam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.45)" />
      <stop offset="12%" stop-color="rgba(255,255,255,0.08)" />
      <stop offset="88%" stop-color="rgba(255,255,255,0.08)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.35)" />
    </linearGradient>

    <!-- Camera lens radial -->
    <radialGradient id="lensGlow" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
  </defs>

  <!-- Physical Side Buttons on Right Frame -->
  <rect x="384.5" y="150" width="3.5" height="54" rx="1.75" fill="#475569" stroke="#1E293B" stroke-width="0.5" />
  <rect x="384.5" y="225" width="3.5" height="36" rx="1.75" fill="#475569" stroke="#1E293B" stroke-width="0.5" />

  <!-- Outer Metallic Chassis with Solid Balanced Corners (rx=44) -->
  <rect x="3" y="3" width="382" height="836" rx="44" ry="44" fill="none" stroke="url(#titaniumChassis)" stroke-width="6" />
  <rect x="3" y="3" width="382" height="836" rx="44" ry="44" fill="none" stroke="url(#edgeGleam)" stroke-width="1.5" />

  <!-- Solid Inner Bezel with Uniform 6px Corner Thickness (rx=36) -->
  <rect x="7" y="7" width="374" height="828" rx="36" ry="36" fill="none" stroke="#090D16" stroke-width="4" />

  <!-- Ear Speaker Micro Mesh at Top Frame Edge -->
  <rect x="168" y="5.5" width="52" height="2" rx="1" fill="#334155" />

  <!-- Centered Front Camera Punch Hole -->
  <circle cx="194" cy="24" r="5.5" fill="#000000" />
  <circle cx="194" cy="24" r="4.3" fill="url(#lensGlow)" />
  <circle cx="192.3" cy="22.3" r="1.2" fill="#FFFFFF" opacity="0.9" />
  <circle cx="194" cy="24" r="5.5" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="0.75" />
</svg>