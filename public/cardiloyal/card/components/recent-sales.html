<!-- ========================================================
     SOCIAL PROOF / RECENT SALES POPUP COMPONENT
     ======================================================== -->
<aside id="recentSalesPopup" aria-live="polite"
    class="recent-sales-popup fixed bottom-4 left-3 sm:bottom-6 sm:left-6 z-50 max-w-[calc(100vw-84px)] sm:max-w-[360px] bg-white rounded-2xl border border-slate-100 p-2.5 sm:p-3.5 select-none">
    <a href="https://lynk.id/cardinusantara/qk553ykn87dd" target="_blank" rel="noopener noreferrer"
        class="flex items-center gap-2.5 sm:gap-3 text-inherit no-underline group cursor-pointer"
        aria-label="Pesan Review LoyaL Card">
        <!-- Thumbnail Gambar Produk (48x48px rounded-xl) -->
        <div class="relative shrink-0 w-11 h-11 sm:w-12 sm:h-12 rounded-xl overflow-hidden bg-slate-100 border border-slate-200/70 shadow-2xs">
            <img src="/cardiloyal/card/assets/plakat-depan.jpg"
                alt="Review LoyaL Card"
                class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-105">
        </div>

        <!-- Konten Teks -->
        <div class="flex-1 min-w-0 pr-4 sm:pr-5">
            <!-- Badge Centang Hijau + Waktu -->
            <div class="flex items-center justify-between gap-1 mb-0.5">
                <span class="inline-flex items-center gap-1 text-[10px] sm:text-[11px] font-bold text-emerald-600">
                    <svg class="w-3 h-3 sm:w-3.5 sm:h-3.5 text-emerald-500 shrink-0" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" />
                    </svg>
                    <span>Pesanan Terverifikasi</span>
                </span>
                <span id="salesTime" class="text-[9.5px] sm:text-[10.5px] text-slate-400 font-medium shrink-0">4 menit yang lalu</span>
            </div>

            <!-- Teks Utama: Nama Pembeli / Bisnis dari Kota -->
            <div class="text-[11px] sm:text-[13px] font-bold text-slate-800 leading-snug truncate">
                <span id="salesBuyer">drg. Vania M***</span>
                <span class="text-slate-400 font-normal text-[10px] sm:text-[11px]">dari</span>
                <span id="salesCity" class="text-slate-700 font-semibold">Jakarta Selatan</span>
            </div>

            <!-- Teks Aktivitas -->
            <div class="text-[10px] sm:text-[11px] text-slate-500 font-medium leading-tight mt-0.5 truncate">
                Baru saja memesan 1x Review LoyaL Card
            </div>
        </div>
    </a>

    <!-- Tombol Close (✕) di Pojok Kanan Atas -->
    <button id="closeRecentSales" type="button"
        class="absolute top-2 right-2 sm:top-2.5 sm:right-2.5 w-5 h-5 sm:w-6 sm:h-6 rounded-full text-slate-400 hover:text-slate-700 hover:bg-slate-100 transition-colors flex items-center justify-center cursor-pointer select-none"
        aria-label="Tutup notifikasi pesanan">
        <svg class="w-3 h-3 sm:w-3.5 sm:h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12" />
        </svg>
    </button>
</aside>
